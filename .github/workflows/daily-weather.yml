name: WeatherNotify Daily

on:
  schedule:
    - cron: "30 0 * * *" # Daily subah 6:00 AM IST chalega
  workflow_dispatch: # Tum GitHub par button click karke manually bhi chala sakte ho

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run WeatherNotify
        env:
          CITY: "Pune"
          LAT: "18.5204"
          LON: "73.8567"
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          PHONE_NUMBER_ID: ${{ secrets.PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: python main.py
